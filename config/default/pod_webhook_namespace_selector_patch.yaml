# Exclude system namespaces from the Pod placement webhook. With failurePolicy: Fail and no namespaceSelector,
# the API server would block recreating the controller-manager Pod itself (and other system Pods) whenever the
# webhook endpoint is down.
#
# This is a strategic merge patch: webhooks are merged by name, so the selector is applied to mpod-v1.kb.io
# regardless of where controller-gen places it in the list.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mpod-v1.kb.io
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - cert-manager
      - workload-class-system
