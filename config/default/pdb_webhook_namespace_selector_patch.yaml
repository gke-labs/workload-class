# Exclude system namespaces from the PodDisruptionBudget validating webhook so cluster components
# in kube-system, cert-manager, and the controller namespace are not rejected by Enforce policies.
#
# This is a strategic merge patch: webhooks are merged by name, so the selector is applied to
# vpoddisruptionbudget-v1.kb.io regardless of where controller-gen places it in the list.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- name: vpoddisruptionbudget-v1.kb.io
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - cert-manager
      - workload-class-system
