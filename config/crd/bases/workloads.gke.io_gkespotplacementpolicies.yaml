---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: gkespotplacementpolicies.workloads.gke.io
spec:
  group: workloads.gke.io
  names:
    kind: GKESpotPlacementPolicy
    listKind: GKESpotPlacementPolicyList
    plural: gkespotplacementpolicies
    shortNames:
    - gkespotpolicy
    singular: gkespotplacementpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.customComputeClass
      name: ComputeClass
      type: string
    - jsonPath: .spec.reversion.action
      name: Reversion
      type: string
    - jsonPath: .status.conditions[?(@.type=='Validated')].status
      name: Validated
      type: string
    - jsonPath: .status.conditions[?(@.type=='SpotCapacityAvailable')].status
      name: SpotAvailable
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: GKESpotPlacementPolicy defines GKE-specific Spot placement, machine
          family, and reversion settings.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GKESpotPlacementPolicy.
            properties:
              customComputeClass:
                description: |-
                  CustomComputeClass is the optional name of a GKE Custom Compute Class
                  (cloud.google.com/compute-class) used for the workload's primary placement.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              fallbackAllowedMachineFamilies:
                description: |-
                  FallbackAllowedMachineFamilies restricts which GKE machine families Pods may schedule onto
                  when falling back to On-Demand capacity during a Spot stockout (e.g., ["e2", "n2d"]).
                  If empty, all machine families are allowed.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              reversion:
                default: {}
                description: |-
                  Reversion configures how fallback Pods running on On-Demand nodes return to GKE Spot VMs
                  once Spot capacity recovers (Active, Lazy, or None).
                properties:
                  action:
                    default: None
                    description: 'Action specifies the reversion strategy once Spot
                      capacity returns: Active, Lazy, or None (default).'
                    enum:
                    - Active
                    - Lazy
                    - None
                    type: string
                  minDurationOnFallback:
                    default: 0s
                    description: |-
                      MinDurationOnFallback sets the minimum duration a Pod must run on On-Demand fallback VMs
                      before becoming eligible for Active reversion (e.g., "4h"), dampening churn when Spot capacity is unstable.
                    type: string
                    x-kubernetes-validations:
                    - message: minDurationOnFallback must be non-negative
                      rule: duration(self) >= duration('0s')
                type: object
                x-kubernetes-validations:
                - message: minDurationOnFallback can only be greater than 0s when
                    reversion action is Active
                  rule: '!has(self.minDurationOnFallback) || duration(self.minDurationOnFallback)
                    == duration(''0s'') || self.action == ''Active'''
            type: object
          status:
            description: status defines the observed state of GKESpotPlacementPolicy.
            properties:
              attachedWorkloadClasses:
                description: AttachedWorkloadClasses lists the "<namespace>/<name>"
                  of WorkloadClasses currently referencing this policy.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              conditions:
                description: Conditions represent the current state of the GKESpotPlacementPolicy
                  resource (e.g., Validated, SpotCapacityAvailable).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller for this GKESpotPlacementPolicy.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
