apiVersion: workloads.gke.io/v1
kind: WorkloadClass
metadata:
  name: critical-batch
  namespace: sample
spec:
  podSelector:
    matchLabels:
      role: batch-processor
  disruptionPolicy:
    allowedDisruptionWindows:
      - name: "weekend-maintenance"
        daysOfWeek:
          - Saturday
          - Sunday
        startTime: "00:00"
        endTime: "04:00"
        timeZone: "America/Toronto"
    minInitialRunDurationDays: 2
    maxNonDisruptionDurationDays: 1
    allowedDisruptionsOutsideOfWindow:
      - kind: ServiceAccount
        name: vpa-updater
        namespace: kube-system
      # Managed GKE Cluster Autoscaler authenticates as User "system:cluster-autoscaler".
      - kind: User
        name: system:cluster-autoscaler
      # Self-hosted Cluster Autoscaler typically uses ServiceAccount kube-system/cluster-autoscaler.
      - kind: ServiceAccount
        name: cluster-autoscaler
        namespace: kube-system
