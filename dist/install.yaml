      name: Validated
      type: string
    - jsonPath: .status.conditions[?(@.type=='SpotCapacityAvailable')].status
      name: SpotAvailable
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
