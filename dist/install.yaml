                == 0 || !has(self.fallbackAllowedMachineFamilies) || size(self.fallbackAllowedMachineFamilies)
                == 0'
          status:
            description: status defines the observed state of GKESpotPlacementPolicy.
            properties:
              conditions:
                description: Conditions represent the current state of the GKESpotPlacementPolicy
                  resource (e.g., Validated, SpotCapacityAvailable).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
