            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WorkloadClass
            properties:
              capacityStrategy:
                description: |-
                  CapacityStrategy defines portable, cloud-agnostic compute capacity and fallback intent
                  (e.g., targeting Spot vs. On-Demand capacity, target Spot percentage, and stockout fallback behavior).
                properties:
                  action:
                    default: Fail
                    description: |-
                      FallbackAction determines whether Pods remain Pending ("Fail") or schedule onto On-Demand ("FallbackToOnDemand")
                      when Spot capacity is unavailable. Default: "Fail".
                    enum:
                    - Fail
                    - FallbackToOnDemand
                    type: string
                  spotRatio:
                    default: 100%
                    description: |-
                      SpotRatio is the target percentage of Pods to place on Spot capacity (e.g., "80%"). Default: "100%".
                      Must be an integer percentage between "0%" and "100%".
                    pattern: ^(100|[1-9]?[0-9])%$
                    type: string
                  type:
                    default: Spot
                    description: 'Type specifies whether the workload targets Spot
                      or OnDemand capacity. Default: "Spot".'
                    enum:
                    - Spot
                    - OnDemand
                    type: string
                type: object
              disruptionPolicy:
                description: DisruptionPolicy specifies the policy governing pod disruptions.
                properties:
                  allowedDisruptionWindows:
                    description: |-
                      AllowedDisruptionWindows defines when disruptions are allowed.
                      When unset or empty, disruptions are allowed at all times on all days of the week.
                    items:
                      description: DisruptionWindow defines a temporal window when
                        disruptions are allowed.
                      properties:
                        daysOfWeek:
                          description: |-
                            DaysOfWeek specifies the days of the week (Monday-Sunday) on which the window starts.
                            When unset or empty, the window applies to every day of the week.
                          items:
                            type: string
                          type: array
                        endTime:
                          description: EndTime is the end time of the window in HH:MM
                            format (e.g. 04:00) in the specified timeZone (or UTC
                            if timeZone is omitted).
                          pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                        name:
                          description: Name is the name of the DisruptionWindow.
                          minLength: 1
                          type: string
                        startTime:
                          description: StartTime is the start time of the window in
                            HH:MM format (e.g. 22:00) in the specified timeZone (or
                            UTC if timeZone is omitted).
                          pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                        timeZone:
                          description: TimeZone is the IANA Time Zone Database name
                            (e.g., "America/Los_Angeles", "America/Argentina/Buenos_Aires",
                            "Etc/UTC", "UTC"). See https://www.iana.org/time-zones.
                          maxLength: 63
                          pattern: ^([A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+){0,2}|UTC|GMT)$
                          type: string
                          x-kubernetes-validations:
                          - message: must not be 'Local' or 'local'
                            rule: self != 'Local' && self != 'local'
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  allowedDisruptionsOutsideOfWindow:
                    description: AllowedDisruptionsOutsideOfWindow specifies subjects
                      that can disrupt even outside of windows. (e.g. VPA, ClusterAutoscaler)
                    items:
                      description: |-
                        Subject defines the identity of a user, group, or service account.
                        It is used to specify who or what is granted permissions or is the target
                        of a policy. The structure aligns with standard Kubernetes RBAC subjects.
                      properties:
                        kind:
                          description: Kind can be User, Group, or ServiceAccount
                          enum:
                          - User
                          - Group
                          - ServiceAccount
                          type: string
                        name:
                          description: Name of the identity
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace of the ServiceAccount (only for ServiceAccount
                            kind)
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - kind
                      - name
                      type: object
